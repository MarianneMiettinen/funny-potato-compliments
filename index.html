<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Potato Compliments</title>
<style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,sans-serif;background:#fff4d6;color:#222;overflow:hidden;text-align:center}
button{font-size:1.6rem;padding:18px 36px;border:none;border-radius:999px;background:#a0522d;color:#fff;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.25)}button:active{transform:translateY(4px)}
#out{font-size:1.4rem;margin:24px 16px;min-height:3em;max-width:600px}#p{font-size:7rem;transition:transform .3s}</style></head><body>
<div id="p">🥔</div><button id="b">Compliment me, potato</button><p id="out">The potato is listening.</p>
<script>const c=["You have the energy of a freshly opened jar of pickles.","Your eyebrows have excellent posture.","If you were a spreadsheet, you'd have no circular references.","Pigeons respect you. I asked.","You blink with such confidence.","You'd make a fantastic lighthouse.","Your knees are statistically above average.","I'd let you hold my last chip.","Your vibe smells like warm toast.","Honestly? Better than a mash."];let last;
b.onclick=()=>{let x;do x=c[Math.random()*c.length|0];while(x===last);last=x;p.style.transform='scale(1.4) rotate('+(Math.random()*60-30)+'deg)';setTimeout(()=>p.style.transform='',300);if(Math.random()<.15){p.textContent='🍟';out.textContent='🥔 got so emotional it turned into fries.'}else{p.textContent='🥔';out.textContent='🥔 says: '+x}}</script></body></html>
